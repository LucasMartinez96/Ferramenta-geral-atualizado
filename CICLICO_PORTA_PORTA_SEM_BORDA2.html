<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<title>Inventário Cíclico (printfit LPP21) — LogoFix</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
/* ── Reset & base ── */
*, *::before, *::after { box-sizing: border-box; }

body {
  font-family: Arial, Helvetica, sans-serif;
  margin: 16px;
  color: #222;
  background: #f4f7fa;
}

h2 { font-size: 24px; font-weight: 800; margin: 0 0 12px; }

/* ── Cards / controles ── */
.card {
  background: #fff;
  border: 1px solid #d1dae3;
  border-radius: 10px;
  padding: 12px;
  margin: 14px 0;
}

.row {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  align-items: center;
  margin-bottom: 8px;
}

input, button, select {
  padding: 8px 12px;
  border: 1px solid #c8d2dd;
  border-radius: 6px;
  font-size: 13px;
}
input[type="file"] { padding: 6px; }
button { cursor: pointer; border: none; }

.file-status {
  display: inline-flex;
  align-items: center;
  min-height: 30px;
  padding: 5px 9px;
  border-radius: 6px;
  font-size: 12px;
  font-weight: 700;
  color: #475569;
  background: #eef2f7;
}
.file-status.success { color: #166534; background: #dcfce7; }
.file-status.error   { color: #991b1b; background: #fee2e2; }
.file-status.loading { color: #1d4ed8; background: #dbeafe; }

.btn-lg {
  min-width: 180px;
  padding: 10px 16px;
  font-weight: 800;
  border-radius: 8px;
  font-size: 13px;
}
.alt     { background: #e9f6ff; border: 2px dashed #1a73e8; color: #1a73e8; }
.primary { background: #1a73e8; color: #fff; }

/* ── Segmented control ── */
.segmented {
  display: inline-flex;
  border: 1px solid #c8d2dd;
  border-radius: 8px;
  overflow: hidden;
  background: #fff;
}
.segmented label { padding: 8px 10px; cursor: pointer; font-size: 12px; }
.segmented input { display: none; }
.segmented input:checked + span { background: #1a73e8; color: #fff; }

.muted { font-size: 12px; color: #666; }

/* ══════════════════════════════════════════════════════
   TABELA — regras gerais
   Larguras são definidas SOMENTE via <col> inline no HTML
   gerado pelo JS (evita conflito CSS × atributo).
   O CSS aqui só cuida de aparência, não de largura.
══════════════════════════════════════════════════════ */
table {
  width: 100%;
  border-collapse: collapse;
  table-layout: fixed;   /* obrigatório para respeitar as larguras dos <col> */
}

th, td {
  border: 1px solid #d8e1ea;
  padding: 5px 7px;
  font-size: 12px;
  line-height: 1.35;
  vertical-align: middle;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}

th {
  background: #eef3f8;
  font-weight: 700;
  text-align: left;
  white-space: nowrap;
}

/* Coluna Codpro: exibir o código completo, sem reticências.
   white-space permanece nowrap (não quebra em várias linhas),
   apenas o corte por overflow/ellipsis é removido. */
th.codpro, td.codpro {
  overflow: visible;
  text-overflow: clip;
}

/* Alinhamento à direita apenas para células explicitamente marcadas */
td.num { text-align: right; }

.grid { border: 1px solid #d8e1ea; }
#printArea { background: #fff; }

/* ── Sheet (folha de impressão) ── */
.sheet {
  border: 3px double #aab4c0;
  padding: 12px;
  margin-bottom: 20px;
  background: #fff;
  display: grid;
  grid-template-rows: auto 1fr auto;
  row-gap: 4px;
}
.sheet + .sheet { page-break-before: always; break-before: page; }

/* Sem borda para porta-porta */
.sheet[data-grupo='porta'] {
  border: none !important;
  box-shadow: none !important;
  display: block !important;
}

/* ── Cabeçalho da folha ── */
.hdr {
  display: grid;
  grid-template-columns: 1fr auto;
  align-items: center;
  gap: 10px;
}
.hdr-left { line-height: 1.2; }
.hdr-left .titulo { font-size: 16px; font-weight: 800; margin: 0 0 2px; }
.hdr-left .dh     { font-size: 12px; color: #333; }
.hdr-right img {
  display: block;
  height: auto;
  max-height: 18mm;
  max-width: 60mm;
  object-fit: contain;
  image-rendering: -webkit-optimize-contrast;
}

.page-header   { margin-bottom: 4px; }
.inventariante { font-size: 12px; margin: 4px 0 0; }
.inventariante .line {
  display: inline-block;
  width: 260px;
  border-bottom: 1px solid #666;
  height: 12px;
}

.grid-wrap    { min-height: 0; overflow-x: auto; }
.page-footer  { margin-top: 4px; font-size: 12px; text-align: right; align-self: end; }

/* ── Impressão ── */
@media print {
  @page { size: A4 landscape; margin: 8mm; }

  html, body { margin: 0 !important; padding: 0 !important; background: #fff !important; }

  h2, #controles, #resultados { display: none !important; }

  .card {
    border: none !important;
    padding: 0 !important;
    margin: 0 !important;
    border-radius: 0 !important;
    box-shadow: none !important;
  }

  #printArea { padding: 0 !important; margin: 0 auto !important; background: #fff !important; }

  /*
     CORREÇÃO DA PÁGINA EM BRANCO NO CHROME/EDGE
     ────────────────────────────────────────────
     Na pré-visualização (tela) o .sheet usa CSS Grid
     (grid-template-rows: auto 1fr auto) para posicionar
     cabeçalho / tabela / rodapé. Combinar um contêiner de
     Grid com "page-break-inside: avoid" é a causa raiz do
     bug clássico do Chrome/Edge: se o conteúdo do .sheet
     ultrapassa a altura útil da folha, o motor de impressão
     empurra o bloco inteiro (por causa do "avoid") para a
     página seguinte e deixa a página anterior em branco.

     A correção é: SOMENTE na impressão, o .sheet volta a um
     fluxo normal em bloco (display:block) e SEM
     "page-break-inside: avoid" na folha inteira. Quem garante
     que nenhuma linha é cortada ao meio é a regra em <tr>
     logo abaixo — muito mais confiável e sem o efeito colateral
     de páginas em branco.
  */
  .sheet {
    display: block !important;
    width: 281mm;
    min-height: 194mm;
    height: auto;
    margin: 0 auto;
    page-break-inside: auto;
    break-inside: auto;
  }

  .sheet[data-grupo='porta'] { border: none !important; box-shadow: none !important; }

  .page-header {
    margin-bottom: 4px;
    page-break-after: avoid;
    break-after: avoid-page;
  }

  .grid-wrap { overflow: visible; min-height: 0; }

  .page-footer {
    position: relative;
    margin-top: 6px;
    padding-top: 3px;
    border-top: 1px solid #d8e1ea;
    text-align: right;
    page-break-before: avoid;
    break-before: avoid-page;
  }

  /* Texto fixo de rodapé, centralizado, em todas as páginas impressas.
     Não interfere na numeração de páginas (que permanece à direita,
     via o texto normal do .page-footer). */
  .page-footer::after {
    content: "F-05BR-C-055 Rev.00";
    position: absolute;
    left: 0;
    right: 0;
    top: 3px;
    text-align: center;
    font-size: 10px;
    color: #666;
    pointer-events: none;
  }

  /* table-layout:fixed já é definido nas regras gerais e NÃO é
     sobrescrito aqui: é isso que garante que o <colgroup> controle
     100% da largura das colunas de forma idêntica no <thead> e no
     <tbody>, em todas as páginas. */
  table { page-break-inside: auto; break-inside: auto; }

  /* Repete o cabeçalho da tabela em cada página, caso alguma
     tabela precise mesmo assim se dividir entre folhas
     (rede de segurança extra para manter cabeçalho e corpo
     sempre alinhados). */
  thead { display: table-header-group; }
  tfoot { display: table-footer-group; }

  /* Nenhuma linha é cortada entre páginas */
  tr {
    page-break-inside: avoid;
    break-inside: avoid-page;
    page-break-after: auto;
  }

  th, td {
    border-color: #cfd6de;
    border-width: 0.5pt;
    padding: 3px 6px;
    font-size: 11.5px;
    line-height: 1.25;
    /*
       Mantém EXATAMENTE o mesmo comportamento de texto da tela:
       uma única linha por célula, com reticências (ellipsis)
       quando o conteúdo não couber na largura da coluna.
       Isto é o que corrige a quebra de linha em "Descrição"
       (que aumentava a altura das linhas) e, por consequência,
       o desalinhamento de colunas e de cabeçalho entre páginas.
    */
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* Coluna Codpro: também na impressão, mostrar o código
     completo, sem reticências e sem quebrar linha. */
  th.codpro, td.codpro {
    overflow: visible;
    text-overflow: clip;
  }

  .grid { border-width: 0.75pt; border-color: #cfd6de; }

  img { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
}
</style>
</head>
<body>
<h2>Inventário Cíclico</h2>

<div id="controles" class="card">
  <div class="row">
    <input type="file" id="fileInput" accept=".csv,.tsv,.xlsx,.xls,.xlt">
    <span class="muted">Carregue CSV, TSV, XLSX, XLS ou XLT.</span>
    <span id="fileStatus" class="file-status" role="status" aria-live="polite">Nenhum arquivo carregado.</span>
  </div>
  <div class="row">
    <input id="search" type="text" placeholder="Buscar por Código (Pieza) ou Descrição — vários códigos: 123456;789012" />
    <button class="primary" id="btnBuscar">Buscar</button>
    <input id="searchPos" type="text" placeholder="Buscar por Posição (ex.: 1-200-0001-00 ou 1-200)" style="min-width:280px" />
    <div class="segmented" title="Filtrar lado da posição (Ubicacion)">
      <label><input type="radio" name="lado" value="todos" checked><span>Todos</span></label>
      <label><input type="radio" name="lado" value="par"><span>Par</span></label>
      <label><input type="radio" name="lado" value="impar"><span>Ímpar</span></label>
    </div>
  </div>
  <div class="row">
    <label class="muted" for="dataManual">Data do PDF:</label>
    <input id="dataManual" type="date" />
    <label class="muted" for="horaManual">Horário do PDF:</label>
    <input id="horaManual" type="time" />
    <span class="muted">Deixe em branco para usar a data/hora atual do sistema.</span>
  </div>
  <div class="row" style="margin-top:4px;">
    <button class="btn-lg alt"     id="btnCiclicoQtd">Cíclico QTD</button>
    <button class="btn-lg primary" id="btnCiclicoSqtd">Cíclico SQTD</button>
    <button class="btn-lg primary" id="btnAmbos">Imprimir QTD + SQTD</button>
    <button class="btn-lg primary" id="btnEmbalagemPosicao">Embalagem Posição</button>
    <button class="btn-lg primary" id="btnPortaPorta">Inventário Porta-Porta</button>
    <button class="btn-lg alt"     id="btnPosicoesLivres">Posições Livres</button>
    <button class="btn-lg primary" onclick="window.print()">🖨️ Imprimir</button>
  </div>
</div>

<div id="resultados" class="card">
  <strong>Prévia dos resultados filtrados</strong>
  <!--
    Colgroup da tabela de prévia (6 colunas, sem Observação):
    Endereço | Codpro | Descrição | Label | Label Origin | Quantidade
  -->
  <table id="tabela">
    <colgroup>
      <col style="width:16%">
      <col style="width:12%">
      <col style="width:32%">
      <col style="width:14%">
      <col style="width:14%">
      <col style="width:12%">
    </colgroup>
  </table>
</div>

<div id="printArea" class="card"></div>

<!-- Bibliotecas externas -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"  crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>

<script>
'use strict';

const LPP = 21;
let dados = [];
let ultimoFiltro = [];
// Ordem dos códigos de material (Pieza) conforme digitados na busca,
// usada apenas para separar a impressão por material (um relatório
// completo por material, em sequência), sem alterar a lógica de busca.
let ordemMateriais = [];

/* ── Utilitários gerais ── */
function chunkArray(arr, size) {
  const out = [];
  for (let i = 0; i < arr.length; i += size) out.push(arr.slice(i, i + size));
  return out;
}

/* ── Separação de impressão por Fábrica (Ubicacion / Posição) ──
   Regra: tudo que começar com "1-" ou "2-" fica no grupo Fábrica 1/2;
   tudo que começar com "3-" fica no grupo Fábrica 3; tudo que começar
   com "4-" fica no grupo Fábrica 4. A ordenação já aplicada antes de
   chamar esta função é preservada dentro de cada grupo (partição
   estável). Cada grupo só é paginado depois que o grupo anterior já
   foi paginado, e nunca compartilham o mesmo bloco/página entre si. */
function chunksPorFabrica(linhas) {
  const fab12 = [];
  const fab3  = [];
  const fab4  = [];

  for (const l of linhas) {
    const chave = String(l.Ubicacion ?? l.name ?? '');
    const primeiro = chave.split('-')[0].trim();

    if (primeiro === '3') {
      fab3.push(l);
    } else if (primeiro === '4') {
      fab4.push(l);
    } else {
      // 1-, 2- e qualquer outro caso continuam no grupo 1/2
      fab12.push(l);
    }
  }
  const blocos12 = chunkArray(fab12, LPP);
  const blocos3  = chunkArray(fab3, LPP);
  const blocos4  = chunkArray(fab4, LPP);

  blocos12.forEach(b => { b._fabGrupo = 'fab12'; });
  blocos3.forEach(b => { b._fabGrupo = 'fab3'; });
  blocos4.forEach(b => { b._fabGrupo = 'fab4'; });

  return [...blocos12, ...blocos3, ...blocos4];
}

function dataHora() {
  const now = new Date();
  const dataVal = document.getElementById('dataManual')?.value || '';
  const horaVal = document.getElementById('horaManual')?.value || '';

  let ano = now.getFullYear(), mes = now.getMonth(), dia = now.getDate();
  let hh  = now.getHours(),    mm  = now.getMinutes(), ss = now.getSeconds();

  if (dataVal) {
    const partes = dataVal.split('-');
    if (partes.length === 3) {
      ano = parseInt(partes[0], 10);
      mes = parseInt(partes[1], 10) - 1;
      dia = parseInt(partes[2], 10);
    }
  }
  if (horaVal) {
    const partes = horaVal.split(':');
    if (partes.length >= 2) {
      hh = parseInt(partes[0], 10);
      mm = parseInt(partes[1], 10);
      ss = 0;
    }
  }

  const d = new Date(ano, mes, dia, hh, mm, ss);
  return {
    data: d.toLocaleDateString('pt-BR', { weekday:'long', day:'2-digit', month:'long', year:'numeric' }),
    hora: d.toLocaleTimeString('pt-BR')
  };
}

function getLogo() { return 'Imagem1.png'; }

function numeroFinal(ubi) {
  if (!ubi) return null;
  const partes = String(ubi).split('-');
  if (partes.length < 3) return null;
  const n = parseInt(partes[2], 10);
  return isNaN(n) ? null : n;
}

function ladoSelecionado() {
  const el = document.querySelector('input[name="lado"]:checked');
  return el?.value || 'todos';
}

function filtraPorLado(arr) {
  const lado = ladoSelecionado();
  if (lado === 'todos') return arr;
  return arr.filter(l => {
    const n = numeroFinal(l.Ubicacion);
    if (n == null || Number.isNaN(n)) return false;
    return lado === 'par' ? (n % 2 === 0) : (n % 2 !== 0);
  });
}

/* ── Cabeçalho da folha ── */
function cabecalho(titulo) {
  const { data, hora } = dataHora();
  const src = getLogo();
  return `
  <div class="page-header">
    <div class="hdr">
      <div class="hdr-left">
        <div class="titulo">${titulo}</div>
        <div class="dh">${data} • ${hora}</div>
      </div>
      <div class="hdr-right"><img src="${src}" alt="Logo"></div>
    </div>
    <div class="inventariante">Inventariante: <span class="line"></span></div>
  </div>`;
}

/* ════════════════════════════════════════════════════════
   tabelaHTML — tabela principal de inventário
   
   CORREÇÕES aplicadas:
   1. colgroup gerado INTEIRAMENTE no JS com larguras que
      somam exatamente 100% nos dois modos (QTD e SQTD).
   2. Alinhamento à direita feito com class="num" na <td>,
      não com seletor nth-child (que errava a coluna no
      modo sem Observação).
   3. Quando mostrarQtd=false a coluna Quantidade some e
      a tabela passa a ter 5 colunas (sem Obs e sem Qtd
      visíveis) — compatível com o cabeçalho gerado.

   Larguras com Observação  (mostrarQtd = true,  7 col):
     Endereço  14% | Codpro 14% | Descrição 24%
     Label 12% | Label Origin 12% | Qtd 8% | Obs 16%
     Total = 100%

   Larguras sem Observação  (mostrarQtd = false, 6 col):
     Endereço  16% | Codpro 15% | Descrição 29%
     Label 14% | Label Origin 14% | Qtd 12%
     Total = 100%

   Coluna Codpro (.codpro) foi alargada e teve o
   text-overflow: ellipsis removido especificamente para
   ela, para exibir códigos longos (ex.: B-39658-342BUY)
   por completo, sem quebrar em várias linhas.
════════════════════════════════════════════════════════ */
function tabelaHTML(linhas, mostrarQtd) {

  /* --- colgroup dinâmico -------------------------------- */
  const colgroup = mostrarQtd
    ? `<colgroup>
         <col style="width:14%">
         <col style="width:14%">
         <col style="width:24%">
         <col style="width:12%">
         <col style="width:12%">
         <col style="width: 8%">
         <col style="width:16%">
       </colgroup>`
    : `<colgroup>
         <col style="width:16%">
         <col style="width:15%">
         <col style="width:29%">
         <col style="width:14%">
         <col style="width:14%">
         <col style="width:12%">
       </colgroup>`;

  /* --- cabeçalho da tabela ----------------------------- */
  const thObs = mostrarQtd ? '<th>Observação</th>' : '';
  const thead = `
    <thead>
      <tr>
        <th>Endereço</th>
        <th class="codpro">Codpro</th>
        <th>Descrição</th>
        <th>Label</th>
        <th>Label Origin</th>
        <th>Quantidade</th>
        ${thObs}
      </tr>
    </thead>`;

  /* --- linhas de dados --------------------------------- */
  const tbody = linhas.map(l => {
    const ubi   = l.Ubicacion  ?? '';
    const pieza = l.Pieza      ?? '';
    const desc  = l.Descripcion1 ?? '';
    const lbl   = l.label      ?? '';
    const orig  = l.labelorigin ?? '';
    const qtd   = mostrarQtd ? (l.CantidadTotal ?? '') : '';
    const tdObs = mostrarQtd ? '<td></td>' : '';

    return `<tr>
      <td title="${ubi}">${ubi}</td>
      <td class="codpro" title="${pieza}">${pieza}</td>
      <td title="${desc}">${desc}</td>
      <td title="${lbl}">${lbl}</td>
      <td title="${orig}">${orig}</td>
      <td class="num" title="${qtd}">${qtd}</td>
      ${tdObs}
    </tr>`;
  }).join('');

  return `
  <div class="grid-wrap">
    <table class="grid">
      ${colgroup}
      ${thead}
      <tbody>${tbody}</tbody>
    </table>
  </div>`;
}

/* ── Tabela Embalagem por Posição ── */
function tabelaEmbalagemHTML(linhas) {
  const linhasHTML = linhas.map(l =>
    `<tr>
       <td title="${l.Ubicacion}">${l.Ubicacion}</td>
       <td title="${l.Pieza}">${l.Pieza}</td>
       <td title="${l.Descripcion1}">${l.Descripcion1}</td>
       <td class="num">${l.QtdEmbalagem}</td>
     </tr>`
  ).join('');

  return `
  <div class="grid-wrap">
    <table class="grid">
      <colgroup>
        <col style="width:20%">
        <col style="width:15%">
        <col style="width:45%">
        <col style="width:20%">
      </colgroup>
      <thead>
        <tr>
          <th>Endereço</th>
          <th>Codpro</th>
          <th>Descrição</th>
          <th>Qtd Embalagens (labels únicos)</th>
        </tr>
      </thead>
      <tbody>${linhasHTML}</tbody>
    </table>
  </div>`;
}

/* ── Numeração de páginas ──
   Numera "Página X de Y" separadamente por material (data-mat), além do
   grupo Fábrica (fabgrupo), para que a paginação de cada material pesquisado
   comece do zero, exatamente como acontece quando se pesquisa um único
   material. data-grupo/data-fabgrupo continuam intactos (CSS de impressão
   e layout não são afetados). */
function numerarGrupo(grupo) {
  const materiais = [...new Set(
    [...document.querySelectorAll(`.sheet[data-grupo="${grupo}"]`)]
      .map(s => s.getAttribute('data-mat') || '0')
  )];

  materiais.forEach(matId => {
    ['fab12', 'fab3', 'fab4'].forEach(fabGrupo => {
      const sheets = [...document.querySelectorAll(`.sheet[data-grupo="${grupo}"][data-fabgrupo="${fabGrupo}"]`)]
        .filter(s => (s.getAttribute('data-mat') || '0') === matId);
      const total  = sheets.length;
      if (total === 0) return;
      sheets.forEach((sheet, idx) => {
        let footer = sheet.querySelector('.page-footer');
        if (!footer) {
          footer = document.createElement('div');
          footer.className = 'page-footer';
          sheet.appendChild(footer);
        }
        footer.textContent = `Página ${idx + 1} de ${total}`;

        /* Assinatura do Inventariante: somente na primeira
           página de cada relatório (cabeçalho — título, data,
           hora e logo — permanece em todas as páginas). */
        if (idx > 0) {
          sheet.querySelector('.inventariante')?.remove();
        }
      });
    });
  });
}

/* ── Separa uma lista já filtrada em relatórios individuais por material ──
   Cada material pesquisado (Pieza) vira seu próprio grupo, preservando a
   ordem em que os códigos foram digitados na busca (ordemMateriais). Se
   não houver mais de um material (busca única, como já funcionava), tudo
   permanece em um único grupo — comportamento 100% igual ao original. */
function separarPorMaterial(lista) {
  if (ordemMateriais.length <= 1) {
    return [{ cod: lista[0]?.Pieza || '', linhas: lista }];
  }
  const porCod = new Map();
  for (const l of lista) {
    const cod = l.Pieza || '';
    if (!porCod.has(cod)) porCod.set(cod, []);
    porCod.get(cod).push(l);
  }
  return ordemMateriais
    .filter(cod => porCod.has(cod))
    .map(cod => ({ cod, linhas: porCod.get(cod) }));
}

/* ── Embalagem por Posição ── */
function gerarEmbalagemPosicao() {
  if (ultimoFiltro.length === 0) {
    document.getElementById('printArea').innerHTML = 'Pesquise primeiro.';
    return;
  }
  const map = new Map();
  for (const l of ultimoFiltro) {
    const pos    = l.Ubicacion   || '';
    const cod    = l.Pieza       || '';
    const desc   = l.Descripcion1 || '';
    const codpal = String(l.labelorigin ?? '').trim();
    const key    = pos + '\n' + cod;
    if (!map.has(key)) map.set(key, { Ubicacion: pos, Pieza: cod, Descripcion1: desc, set: new Set() });
    if (codpal) map.get(key).set.add(codpal);
  }

  const linhas = Array.from(map.values()).map(o => ({
    Ubicacion: o.Ubicacion, Pieza: o.Pieza, Descripcion1: o.Descripcion1, QtdEmbalagem: o.set.size
  }));

  linhas.sort((a, b) => {
    const r = String(a.Ubicacion || '').localeCompare(String(b.Ubicacion || ''), 'pt-BR', { numeric: true, sensitivity: 'base' });
    return r !== 0 ? r : String(a.Pieza || '').localeCompare(String(b.Pieza || ''), 'pt-BR', { numeric: true, sensitivity: 'base' });
  });

  const printArea = document.getElementById('printArea');
  printArea.innerHTML = '';

  chunksPorFabrica(linhas).forEach(bloco => {
    const section = document.createElement('section');
    section.className = 'sheet';
    section.setAttribute('data-grupo', 'embalagem');
    section.setAttribute('data-fabgrupo', bloco._fabGrupo);
    section.innerHTML = `${cabecalho('Embalagem por Posição (contagem de labels distintos)')}${tabelaEmbalagemHTML(bloco)}<div class="page-footer"></div>`;
    printArea.appendChild(section);
  });

  numerarGrupo('embalagem');
}

/* ── Montagem da prévia ── */
function montarTabela() {
  const termoRaw = (document.getElementById('search').value || '');
  const termoPos = (document.getElementById('searchPos').value || '').toLowerCase().trim();
  const tabela   = document.getElementById('tabela');
  tabela.innerHTML = '';

  // Suporte a múltiplos códigos separados por ";" (ex.: 123456; 789012; 345678)
  // Remove espaços extras e códigos duplicados. Se nada for digitado, mantém
  // o comportamento original (termo vazio = combina com todas as descrições).
  const termosBrutos = termoRaw.split(';').map(t => t.trim().toLowerCase()).filter(t => t.length > 0);
  const termos    = termosBrutos.length > 0 ? [...new Set(termosBrutos)] : [''];
  const multiplo  = termosBrutos.length > 1;

  // Mesma regra de match de sempre (Pieza exata OU Descrição contém),
  // agora aplicada a cada termo informado.
  let base = dados.filter(l => {
    const pieza = String(l.Pieza        || '').toLowerCase();
    const desc  = String(l.Descripcion1 || '').toLowerCase();
    return termos.some(t => pieza === t || desc.includes(t));
  });
  if (termoPos) base = base.filter(l => String(l.Ubicacion || '').toLowerCase().startsWith(termoPos));
  ultimoFiltro = filtraPorLado(base);

  // Guarda a ordem dos materiais (Pieza) exatamente na sequência em que os
  // códigos foram digitados na busca, para uso exclusivo na separação da
  // impressão por material (não afeta a busca/tabela em si).
  ordemMateriais = [];
  if (multiplo) {
    const vistos = new Set();
    termos.forEach(t => {
      dados.forEach(l => {
        const pieza = String(l.Pieza        || '').toLowerCase();
        const desc  = String(l.Descripcion1 || '').toLowerCase();
        if ((pieza === t || desc.includes(t)) && !vistos.has(l.Pieza)) {
          vistos.add(l.Pieza);
          ordemMateriais.push(l.Pieza);
        }
      });
    });
  }

  // Identifica quais códigos pesquisados (no modo múltiplo) não retornaram nada,
  // sem interromper a exibição dos demais resultados.
  let naoEncontrados = [];
  if (multiplo) {
    naoEncontrados = termos.filter(t => !dados.some(l =>
      String(l.Pieza || '').toLowerCase() === t || String(l.Descripcion1 || '').toLowerCase().includes(t)
    ));
  }

  if (ultimoFiltro.length === 0) {
    tabela.innerHTML = '<tr><td>Nada encontrado</td></tr>';
    if (naoEncontrados.length > 0) {
      const tr = tabela.insertRow();
      const td = tr.insertCell();
      td.textContent = 'Códigos não encontrados: ' + naoEncontrados.join(', ');
      td.style.color = '#b00020';
      td.style.fontStyle = 'italic';
    }
    return;
  }

  const header = tabela.insertRow();
  ['Endereço','Codpro','Descrição','Label','Label Origin','Quantidade'].forEach(txt => {
    const th = document.createElement('th');
    th.textContent = txt;
    header.appendChild(th);
  });

  ultimoFiltro.forEach(l => {
    const tr = tabela.insertRow();
    tr.insertCell().textContent = l.Ubicacion    ?? '';
    tr.insertCell().textContent = l.Pieza        ?? '';
    tr.insertCell().textContent = l.Descripcion1 ?? '';
    tr.insertCell().textContent = l.label        ?? '';
    tr.insertCell().textContent = l.labelorigin  ?? '';
    const tdQtd = tr.insertCell();
    tdQtd.textContent = l.CantidadTotal ?? '';
    tdQtd.className   = 'num';
  });

  if (naoEncontrados.length > 0) {
    const trAviso = tabela.insertRow();
    const tdAviso = trAviso.insertCell();
    tdAviso.colSpan = 6;
    tdAviso.style.color = '#b00020';
    tdAviso.style.fontStyle = 'italic';
    tdAviso.textContent = 'Códigos não encontrados: ' + naoEncontrados.join(', ');
  }
}

/* ── Carregamento de arquivo ── */
const ALIASES_CABECALHO = new Map([
  ['ubicacion', 'Ubicacion'], ['location', 'Ubicacion'], ['localizacao', 'Ubicacion'],
  ['endereco', 'Ubicacion'], ['posicao', 'Ubicacion'],
  ['pieza', 'Pieza'], ['peca', 'Pieza'], ['codpro', 'Pieza'], ['codigo', 'Pieza'],
  ['codigomaterial', 'Pieza'], ['item', 'Pieza'], ['material', 'Pieza'],
  ['descripcion1', 'Descripcion1'], ['descripcion', 'Descripcion1'],
  ['descricao', 'Descripcion1'], ['description', 'Descripcion1'],
  ['label', 'label'], ['etiqueta', 'label'],
  ['labelorigin', 'labelorigin'], ['labelorigem', 'labelorigin'],
  ['etiquetaorigem', 'labelorigin'], ['etiquetaorigen', 'labelorigin'],
  ['cantidadtotal', 'CantidadTotal'], ['cantidad', 'CantidadTotal'],
  ['quantidade', 'CantidadTotal'], ['qtde', 'CantidadTotal'], ['qtd', 'CantidadTotal'],
  ['quantity', 'CantidadTotal'],
  ['name', 'name'], ['nome', 'name'],
  ['label2', 'label2'], ['etiqueta2', 'label2']
]);

function chaveCabecalho(valor) {
  return String(valor ?? '')
    .replace(/^\uFEFF/, '')
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g, '')
    .toLowerCase()
    .replace(/[^a-z0-9]/g, '');
}

function atualizarStatusArquivo(mensagem, tipo = '') {
  const status = document.getElementById('fileStatus');
  if (!status) return;
  status.textContent = mensagem;
  status.className = `file-status${tipo ? ' ' + tipo : ''}`;
}

function normalizarRegistros(registros) {
  return registros.map(registro => {
    const normalizado = {};
    Object.entries(registro).forEach(([cabecalhoOriginal, valor]) => {
      const cabecalhoLimpo = String(cabecalhoOriginal).replace(/^\uFEFF/, '').trim();
      if (!cabecalhoLimpo) return;
      normalizado[cabecalhoLimpo] = valor;
      const canonico = ALIASES_CABECALHO.get(chaveCabecalho(cabecalhoLimpo));
      if (canonico && (normalizado[canonico] === undefined || normalizado[canonico] === '')) {
        normalizado[canonico] = valor;
      }
    });
    return normalizado;
  }).filter(registro => Object.values(registro).some(v => String(v ?? '').trim() !== ''));
}

function localizarLinhaCabecalho(matriz) {
  let melhorIndice = -1;
  let melhorPontuacao = -1;
  const limite = Math.min(matriz.length, 40);

  for (let i = 0; i < limite; i++) {
    const celulas = (matriz[i] || []).map(v => String(v ?? '').trim());
    const preenchidas = celulas.filter(Boolean);
    if (preenchidas.length === 0) continue;
    const reconhecidas = celulas.filter(v => ALIASES_CABECALHO.has(chaveCabecalho(v))).length;
    const pontuacao = reconhecidas * 100 + Math.min(preenchidas.length, 20);
    if (pontuacao > melhorPontuacao) {
      melhorPontuacao = pontuacao;
      melhorIndice = i;
    }
  }
  return melhorIndice;
}

function matrizParaRegistros(matriz) {
  const indiceCabecalho = localizarLinhaCabecalho(matriz);
  if (indiceCabecalho < 0) return [];

  const usados = new Map();
  const cabecalhos = (matriz[indiceCabecalho] || []).map((valor, indice) => {
    const base = String(valor ?? '').replace(/^\uFEFF/, '').trim() || `Coluna_${indice + 1}`;
    const repeticoes = usados.get(base) || 0;
    usados.set(base, repeticoes + 1);
    return repeticoes === 0 ? base : `${base}_${repeticoes + 1}`;
  });

  const registros = matriz.slice(indiceCabecalho + 1).map(linha => {
    const registro = {};
    cabecalhos.forEach((cabecalho, indice) => { registro[cabecalho] = linha?.[indice] ?? ''; });
    return registro;
  });
  return normalizarRegistros(registros);
}

function detectarSeparadorCSV(texto) {
  const candidatos = [';', '\t', ',', '|'];
  const amostra = texto.slice(0, 50000);
  const contagens = new Map(candidatos.map(c => [c, 0]));
  let entreAspas = false;

  for (let i = 0; i < amostra.length; i++) {
    const ch = amostra[i];
    if (ch === '"') {
      if (entreAspas && amostra[i + 1] === '"') i++;
      else entreAspas = !entreAspas;
    } else if (!entreAspas && contagens.has(ch)) {
      contagens.set(ch, contagens.get(ch) + 1);
    }
  }
  return candidatos.sort((a, b) => contagens.get(b) - contagens.get(a))[0];
}

function analisarCSV(texto) {
  const separador = detectarSeparadorCSV(texto);
  const linhas = [];
  let linha = [];
  let celula = '';
  let entreAspas = false;

  for (let i = 0; i < texto.length; i++) {
    const ch = texto[i];
    if (ch === '"') {
      if (entreAspas && texto[i + 1] === '"') {
        celula += '"';
        i++;
      } else {
        entreAspas = !entreAspas;
      }
    } else if (ch === separador && !entreAspas) {
      linha.push(celula);
      celula = '';
    } else if ((ch === '\n' || ch === '\r') && !entreAspas) {
      if (ch === '\r' && texto[i + 1] === '\n') i++;
      linha.push(celula);
      if (linha.some(v => String(v).trim() !== '')) linhas.push(linha);
      linha = [];
      celula = '';
    } else {
      celula += ch;
    }
  }
  linha.push(celula);
  if (linha.some(v => String(v).trim() !== '')) linhas.push(linha);
  return linhas;
}

async function lerTextoArquivo(file) {
  const buffer = await file.arrayBuffer();
  let texto = new TextDecoder('utf-8').decode(buffer);
  if (texto.includes('\uFFFD')) {
    try { texto = new TextDecoder('windows-1252').decode(buffer); } catch (_) { /* usa UTF-8 */ }
  }
  return texto.replace(/^\uFEFF/, '');
}

function carregarScript(src) {
  return new Promise((resolve, reject) => {
    const script = document.createElement('script');
    script.src = src;
    script.onload = resolve;
    script.onerror = () => reject(new Error('Falha ao baixar o leitor Excel.'));
    document.head.appendChild(script);
  });
}

async function garantirLeitorExcel() {
  if (typeof XLSX !== 'undefined') return;
  try {
    await carregarScript('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js');
  } catch (_) {
    throw new Error('O leitor de Excel não carregou. Conecte o aparelho à internet e abra o HTML novamente, ou use um arquivo CSV.');
  }
  if (typeof XLSX === 'undefined') {
    throw new Error('O leitor de Excel não ficou disponível. Use CSV ou tente abrir novamente com internet.');
  }
}

function escolherPlanilha(wb) {
  let melhor = null;
  for (const nomeAba of wb.SheetNames || []) {
    const ws = wb.Sheets[nomeAba];
    if (!ws) continue;
    const matriz = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '', raw: false, blankrows: false });
    const registros = matrizParaRegistros(matriz);
    if (registros.length === 0) continue;
    const campos = new Set(Object.keys(registros[0] || {}));
    const reconhecidos = ['Ubicacion', 'Pieza', 'Descripcion1', 'label', 'labelorigin', 'CantidadTotal', 'name', 'label2']
      .filter(c => campos.has(c)).length;
    const pontuacao = reconhecidos * 1000000 + registros.length;
    if (!melhor || pontuacao > melhor.pontuacao) melhor = { nomeAba, registros, pontuacao };
  }
  if (!melhor) throw new Error('Nenhuma aba com dados foi encontrada no arquivo.');
  return melhor;
}

function validarRegistros(registros) {
  if (!Array.isArray(registros) || registros.length === 0) {
    throw new Error('O arquivo não possui linhas de dados.');
  }
  const campos = new Set(registros.slice(0, 100).flatMap(r => Object.keys(r)));
  const inventario = campos.has('Pieza') && (campos.has('Ubicacion') || campos.has('Descripcion1'));
  const posicoesLivres = campos.has('name') && campos.has('label2');
  if (!inventario && !posicoesLivres) {
    const encontrados = [...campos].slice(0, 12).join(', ') || 'nenhum';
    throw new Error(`Cabeçalhos não reconhecidos. Esperado: Ubicacion/Pieza ou name/label2. Encontrado: ${encontrados}.`);
  }
}

function concluirCarregamento(file, registros, nomeAba = '') {
  validarRegistros(registros);
  dados = registros;
  ultimoFiltro = [];
  ordemMateriais = [];

  const tabela = document.getElementById('tabela');
  tabela.innerHTML = '';
  const tr = tabela.insertRow();
  const td = tr.insertCell();
  td.textContent = `Arquivo pronto: ${file.name} (${dados.length} linhas). Digite a busca e clique em Buscar.`;
  document.getElementById('printArea').innerHTML = '';

  const detalheAba = nomeAba ? ` • Aba: ${nomeAba}` : '';
  atualizarStatusArquivo(`${file.name} • ${dados.length} linhas${detalheAba}`, 'success');
  alert(`Arquivo carregado com sucesso!\nLinhas: ${dados.length}${nomeAba ? `\nAba: ${nomeAba}` : ''}`);
}

document.getElementById('fileInput').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const nome = file.name.toLowerCase();
  atualizarStatusArquivo(`Lendo ${file.name}...`, 'loading');
  try {
    if (nome.endsWith('.csv') || nome.endsWith('.tsv')) {
      const texto = await lerTextoArquivo(file);
      const registros = matrizParaRegistros(analisarCSV(texto));
      concluirCarregamento(file, registros);
    } else if (nome.endsWith('.xlsx') || nome.endsWith('.xls') || nome.endsWith('.xlt')) {
      await garantirLeitorExcel();
      const buf = await file.arrayBuffer();
      const wb = XLSX.read(buf, { type: 'array', cellDates: true });
      const planilha = escolherPlanilha(wb);
      concluirCarregamento(file, planilha.registros, planilha.nomeAba);
    } else {
      throw new Error('Formato não suportado. Use CSV, TSV, XLSX, XLS ou XLT.');
    }
  } catch (err) {
    console.error('Erro ao carregar arquivo:', err);
    const mensagem = err?.message || String(err);
    dados = [];
    ultimoFiltro = [];
    atualizarStatusArquivo(`Erro: ${mensagem}`, 'error');
    alert('Erro ao carregar: ' + mensagem);
    e.target.value = '';
  }
});
